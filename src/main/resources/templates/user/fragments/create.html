<form th:fragment="userFormFragment" id="createUserForm">
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required>
    </div>

    <div class="form-group">
        <label for="firstName">Имя:</label>
        <input type="text" id="firstName" name="firstName" maxlength="100">
    </div>

    <div class="form-group" th:replace="users/fragments/select-role"></div>

    <div class="form-group">
        <label for="lastName">Фамилия:</label>
        <input type="text" id="lastName" name="lastName" maxlength="100">
    </div>

    <button type="submit">Создать</button>
</form>
