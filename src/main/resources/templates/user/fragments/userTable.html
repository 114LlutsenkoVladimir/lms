<div id="table-container" class="table-wrapper card-table">
    <table id="users-table" class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>Id</th>
            <th>Ім'я</th>
            <th>Прізвище</th>
            <th>Email</th>
        </tr>
        </thead>
        <tbody id="user-tbody">
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">Id</td>
                <td th:text="${user.firstName}">Ім'я</td>
                <td th:text="${user.lastName}">Прізвище</td>
                <td th:text="${user.email}">Email</td>
            </tr>
        </tbody>
    </table>
</div>
